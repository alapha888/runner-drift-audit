name: "Runner Drift Audit"
description: "Scan workflows for floating runner labels, unpinned action refs, and tool drift ahead of the Ubuntu 26.04 migration."
author: "alapha888"
branding:
  icon: "alert-triangle"
  color: "orange"
inputs:
  path:
    description: "Path to the repository or directory to scan (must contain .github/workflows)."
    required: false
    default: "."
  fail-on-high:
    description: "Fail the step when any HIGH finding exists. Set to 'false' to report only."
    required: false
    default: "true"
  sarif-file:
    description: "Also write findings as SARIF 2.1.0 JSON to this path (for GitHub Code Scanning upload). Empty disables it."
    required: false
    default: ""
  json-file:
    description: "Also write findings as plain machine-readable JSON (schema v1: summary counts plus per-file findings) to this path. Empty disables it."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run runner drift audit
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        JSON_FILE: ${{ inputs.json-file }}
      run: |
        case "$FAIL_ON_HIGH" in
          true|false) ;;
          *) echo "::error::fail-on-high must be 'true' or 'false', got '$FAIL_ON_HIGH'"; exit 2 ;;
        esac
        set +e
        out="$(mktemp)"
        sarif_args=()
        if [ -n "$SARIF_FILE" ]; then
          sarif_args=(--sarif "$SARIF_FILE")
        fi
        json_args=()
        if [ -n "$JSON_FILE" ]; then
          json_args=(--json "$JSON_FILE")
        fi
        python3 "${{ github.action_path }}/runner_drift_audit.py" "$SCAN_PATH" "${sarif_args[@]}" "${json_args[@]}" | tee "$out"
        code=${PIPESTATUS[0]}
        if [ "$code" -eq 0 ]; then
          exit 0
        fi
        if ! grep -q "HIGH findings:" "$out"; then
          echo "::error::scanner failed to run (exit $code)"
          exit "$code"
        fi
        if [ "$FAIL_ON_HIGH" = "false" ]; then
          echo "HIGH findings present but fail-on-high is false; reporting only."
          exit 0
        fi
        exit "$code"
